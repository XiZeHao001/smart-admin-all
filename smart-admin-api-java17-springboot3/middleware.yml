name: smart-admin-middleware

services:
  # -----------------------------------------------------------------------------
  # 1. 数据库服务 (Postgres)
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: smart-admin-postgres
    restart: always
    environment:
      POSTGRES_DB: smart_admin_v3
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      # ⚠️ 确保宿主机 /data/postgres 目录存在且有权限，否则数据会丢！
      - /data/postgres:/var/lib/postgresql/data
    networks:
      - smart-admin-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------------
  # 2. Redis 服务
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    # 修正了你之前的名字 redis2，统一命名规范
    container_name: smart-admin-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /home/app/data/redis:/data
    networks:
      - smart-admin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# -----------------------------------------------------------------------------
# 网络定义：这里是网络的【创建者】
# -----------------------------------------------------------------------------
networks:
  smart-admin-network:
    name: smart-admin-network
    driver: bridge