global:
  scrape_interval: 15s

scrape_configs:
  # 1. Java 应用 (已存在)
  - job_name: 'smart-admin-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['smart-admin-app:10010']

  # 2. 宿主机监控 (新增)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['smart-admin-node-exporter:9100']

  # 3. Redis 监控 (新增)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['smart-admin-redis-exporter:9121']